behaviors:
  Flame: &species
    trainer_type: ppo
    hyperparameters:
      batch_size: 64
      buffer_size: 256
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 32
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 2048
    time_horizon: 64
    summary_freq: 256
    checkpoint_interval: 2048
    keep_checkpoints: 1
  Frost: *species
  Moss: *species
